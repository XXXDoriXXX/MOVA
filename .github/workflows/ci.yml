name: CI
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mova_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mova_test
      DATABASE_SSL: 'false'
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      LIVEKIT_URL: https://ci-placeholder.livekit.cloud
      LIVEKIT_API_KEY: ci-placeholder-key
      LIVEKIT_API_SECRET: ci-placeholder-secret
      DEEPGRAM_API_KEY: ci-placeholder-deepgram
      SETTINGS_ENCRYPTION_KEY: ci-placeholder-settings-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci
      - run: npx nx run-many -t lint --parallel=2
      - run: npx nx run-many -t test --parallel=2 --runInBand
      - run: npx nx run admin:typecheck
      - run: npx nx run-many -t build --projects=api-gateway,realtime-service,agent-worker,shared-database,admin --parallel=2
      - name: Apply migrations to a fresh database, then repeat
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/libs/shared-database/src/data-source.js
          node node_modules/typeorm/cli.js migration:run -d dist/libs/shared-database/src/data-source.js
      - name: Check deployment script
        run: bash -n tools/server.sh tools/deploy-trigger.sh
