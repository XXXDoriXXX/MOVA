name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mova_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ci-test-redis-password
      LIVEKIT_URL: https://ci-placeholder.livekit.cloud
      LIVEKIT_API_KEY: ci-placeholder-key
      LIVEKIT_API_SECRET: ci-placeholder-secret
      OPENAI_API_KEY: ci-placeholder-openai
      DEEPGRAM_API_KEY: ci-placeholder-deepgram

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, test & build
        run: npx nx run-many -t lint test build --passWithNoTests

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [api-gateway, agent-worker]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Docker image (${{ matrix.app }})
        run: |
          docker build \
            --build-arg APP_NAME=${{ matrix.app }} \
            --tag mova-back/${{ matrix.app }}:ci-${{ github.sha }} \
            --file Dockerfile \
            .
