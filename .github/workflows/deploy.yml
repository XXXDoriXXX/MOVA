name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: mova-production
  cancel-in-progress: false
permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: api-gateway, target: runner}
          - {app: realtime-service, target: runner}
          - {app: agent-worker, target: runner}
          - {app: migrations, target: migrations}
          - {app: web, target: web}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry owner
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mova" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: APP_NAME=${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.app }}

  deploy:
    if: github.repository == 'XXXDoriXXX/MOVA' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy/server')
    needs: images
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Install tunnel client
        run: |
          curl --fail --silent --show-error --location https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
      - name: Deploy verified images
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.MOVA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MOVA_SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/mova"
          chmod 600 "$HOME/.ssh/mova"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/mova" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=25 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o ProxyCommand='cloudflared access ssh --hostname %h' \
            dori@sshdori.dehimik.org "deploy $IMAGE_TAG"
      - name: Verify public routes
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --max-time 15 https://mova.dehimik.org/health/ready
          curl --fail --silent --show-error --max-time 15 'https://mova.dehimik.org/socket.io/?EIO=4&transport=polling'
