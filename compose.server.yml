# Standalone: never merges the development stack or touches another project.
name: mova-prod

x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}

x-app: &app
  restart: unless-stopped
  init: true
  env_file: .env.production
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://mova:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/mova
    DATABASE_SSL: 'false'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mova
      POSTGRES_DB: mova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mova -d mova']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment: {REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD}'}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction']
    volumes: [redis_data:/data]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrations:
    <<: *app
    image: ${MOVA_IMAGE_PREFIX:-ghcr.io/xxxdorixxx/mova}-migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: 'no'
    mem_limit: 512m
    cpus: 1

  api-gateway:
    <<: *app
    image: ${MOVA_IMAGE_PREFIX:-ghcr.io/xxxdorixxx/mova}-api-gateway:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *app-env
      PORT: '3000'
      SERVICE_NAME: api-gateway
      AGENT_SERVICE_URL: http://agent-worker:3001
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  realtime-service:
    <<: *app
    image: ${MOVA_IMAGE_PREFIX:-ghcr.io/xxxdorixxx/mova}-realtime-service:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *app-env
      PORT: '3002'
      SERVICE_NAME: realtime-service
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3002/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent-worker:
    <<: *app
    image: ${MOVA_IMAGE_PREFIX:-ghcr.io/xxxdorixxx/mova}-agent-worker:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      <<: *app-env
      PORT: '3001'
      SERVICE_NAME: agent-worker
      RUN_MODE: start
    mem_limit: 1536m
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: ${MOVA_IMAGE_PREFIX:-ghcr.io/xxxdorixxx/mova}-web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    environment:
      MOVA_MOBILE_WEB_ENABLED: '${MOVA_MOBILE_WEB_ENABLED:-false}'
    ports: ['${MOVA_BIND_IP:-0.0.0.0}:${MOVA_PORT:-8794}:80']
    depends_on:
      api-gateway: {condition: service_healthy}
      realtime-service: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  mobile-web:
    profiles: [beta]
    image: ghcr.io/xxxdorixxx/mova-browser:${MOVA_MOBILE_WEB_TAG:-not-enabled}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres_data:
  redis_data:
