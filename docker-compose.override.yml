# ============================================================================
# Development overrides — auto-merged into docker-compose.yml.
#
# What changes vs. base compose:
#   - All three Node services switch to `nx serve` (hot reload).
#   - Source code is bind-mounted so edits restart the process automatically.
#   - dist + .nx folders are kept INSIDE the container (anonymous volumes)
#     to prevent Windows ↔ Linux path-separator cross-OS cache poisoning.
#   - Runtime safety-net: each service checks `node_modules/typeorm` (proxy
#     for "deps are installed") and falls back to `npm ci --legacy-peer-deps`
#     if the anonymous volume came up empty (known Docker-Desktop-on-Windows
#     behaviour with anon volumes overlaying image-built paths).
#
# To run prod-shaped stack (without these overrides):
#   docker compose -f docker-compose.yml up -d --build
# ============================================================================

# Shared shell prelude — repeats the same install safety-net before nx serve.
# YAML anchors below avoid hand-syncing three identical commands.
x-dev-command: &dev-command >-
  sh -c "test -d /app/node_modules/typeorm
         || (echo '⚠️  node_modules missing in volume — installing now (3-5 min, first run only)';
             npm ci --legacy-peer-deps);
         exec $$NX_SERVE_CMD"

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Migrations — same in dev as prod (one-shot). No override needed.
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # api-gateway — nx serve with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: *dev-command
    volumes:
      - .:/app
      - /app/node_modules # anonymous — keep container's npm ci output
      - /app/dist         # isolate build output from host FS (Windows safety)
      - /app/.nx          # isolate Nx cache for the same reason
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"  # daemon is unreliable inside containers; disable
      NX_SERVE_CMD: "npx nx serve api-gateway --host 0.0.0.0 --skip-nx-cache"

  # ──────────────────────────────────────────────────────────────────────────
  # realtime-service — same dev pattern
  # ──────────────────────────────────────────────────────────────────────────
  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: *dev-command
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"
      NX_SERVE_CMD: "npx nx serve realtime-service --host 0.0.0.0 --skip-nx-cache"

  # ──────────────────────────────────────────────────────────────────────────
  # agent-worker — same dev pattern
  # ──────────────────────────────────────────────────────────────────────────
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: *dev-command
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      NX_SERVE_CMD: "npx nx serve agent-worker --host 0.0.0.0 --skip-nx-cache"

  # ──────────────────────────────────────────────────────────────────────────
  # migrations — also needs the safety-net (no nx, just typeorm CLI)
  # ──────────────────────────────────────────────────────────────────────────
  migrations:
    command: >-
      sh -c "test -d /app/node_modules/typeorm
             || (echo '⚠️  node_modules missing in volume — installing now';
                 npm ci --legacy-peer-deps);
             npx typeorm-ts-node-commonjs migration:run -d libs/shared-database/src/data-source.ts"
    volumes:
      - .:/app
      - /app/node_modules
