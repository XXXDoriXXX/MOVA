# ============================================================================
# Development overrides — auto-merged into docker-compose.yml.
#
# What changes vs. base compose:
#   - All three Node services switch to `nx serve` (hot reload).
#   - Source code is bind-mounted so edits restart the process automatically.
#   - dist + .nx folders are kept INSIDE the container (anonymous volumes)
#     to prevent Windows ↔ Linux path-separator cross-OS cache poisoning.
#   - Runtime safety-net: each service checks `node_modules/typeorm` (proxy
#     for "deps installed") and falls back to `npm ci --legacy-peer-deps`
#     if the anonymous volume came up empty (known Docker-Desktop-on-Windows
#     behaviour with anon volumes overlaying image-built paths).
#   - Each container wipes its own `.nx/workspace-data` BEFORE `nx serve`.
#     Nx 22 stores a per-task "in-progress" lock there; if the previous
#     container died un-gracefully (Ctrl-C, docker restart, host sleep)
#     the lock survives the restart and the next `nx serve` blocks
#     forever waiting for the "still-running" task. Wiping the dir is
#     idempotent and costs ~10 ms. Host-side `npm run nx:reset` covers
#     the same case for nx invocations on the host.
#
# YAML note: shell commands are written as single-line plain scalars (no
# `>-` folding). Folded scalars preserve indentation as newlines when
# continuation lines are deeper than the parent — sh then sees `||` as
# the first token of a new line and bails with a syntax error. One line,
# no surprises.
#
# To run prod-shaped stack (without these overrides):
#   docker compose -f docker-compose.yml up -d --build
# ============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────
  # migrations — needs the safety-net + build shared-database first.
  # TypeORM 0.3's CLI loads the data source via native `await import()`,
  # which goes through Node's ESM resolver and won't find .ts files even
  # with typeorm-ts-node-commonjs. We compile shared-database with Nx tsc
  # and point typeorm at the JS bundle in dist/. Same fix is applied to
  # host-side `npm run migration:*` scripts.
  # ──────────────────────────────────────────────────────────────────────────
  migrations:
    command: ["sh", "-c", "test -d /app/node_modules/typeorm || { echo '⚠️  node_modules missing in volume — installing now (3-5 min, first run only)'; npm ci --legacy-peer-deps; }; npx nx build shared-database && npx typeorm migration:run -d dist/libs/shared-database/src/data-source.js"]
    volumes:
      - .:/app
      - /app/node_modules

  # ──────────────────────────────────────────────────────────────────────────
  # api-gateway — nx serve with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: ["sh", "-c", "test -d /app/node_modules/typeorm || { echo '⚠️  node_modules missing in volume — installing now (3-5 min, first run only)'; npm ci --legacy-peer-deps; }; rm -rf /app/.nx/workspace-data 2>/dev/null || true; exec npx nx serve api-gateway --host 0.0.0.0 --skip-nx-cache"]
    volumes:
      - .:/app
      - /app/node_modules # anonymous — keep container's npm ci output
      - /app/dist         # isolate build output from host FS (Windows safety)
      - /app/.nx          # isolate Nx cache for the same reason
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"  # daemon is unreliable inside containers; disable

  # ──────────────────────────────────────────────────────────────────────────
  # realtime-service — same dev pattern
  # ──────────────────────────────────────────────────────────────────────────
  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: ["sh", "-c", "test -d /app/node_modules/typeorm || { echo '⚠️  node_modules missing in volume — installing now (3-5 min, first run only)'; npm ci --legacy-peer-deps; }; rm -rf /app/.nx/workspace-data 2>/dev/null || true; exec npx nx serve realtime-service --host 0.0.0.0 --skip-nx-cache"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"

  # ──────────────────────────────────────────────────────────────────────────
  # agent-worker — same dev pattern
  #
  # `dns: []` clears the production hard-pin to 8.8.8.8 / 8.8.4.4. On
  # Docker Desktop on Windows / WSL2 that pin frequently breaks outbound
  # connectivity from the container — the WSL2 bridge can't always reach
  # 8.8.8.8 directly, depending on router config. Letting Docker fall back
  # to its embedded resolver (which forwards to the host's DNS) fixes the
  # `failed to retrieve region info` LiveKit error on Windows dev setups.
  # If you actually need the Google pin for prod, leave the base service
  # alone — this override only applies when docker-compose.override.yml
  # is auto-merged, i.e. in dev.
  # ──────────────────────────────────────────────────────────────────────────
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    command: ["sh", "-c", "test -d /app/node_modules/typeorm || { echo '⚠️  node_modules missing in volume — installing now (3-5 min, first run only)'; npm ci --legacy-peer-deps; }; rm -rf /app/.nx/workspace-data 2>/dev/null || true; exec npx nx serve agent-worker --host 0.0.0.0 --skip-nx-cache"]
    dns: []
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.nx
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/.npm
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"

  # ──────────────────────────────────────────────────────────────────────────
  # dozzle — web UI for docker container logs (dev only).
  #
  # Open http://localhost:9999 in a browser. Streams live logs from every
  # container that's currently in this compose project; search, filter and
  # split panes per container without juggling terminals.
  #
  # Read-only Docker-socket mount: dozzle never writes, only tails.
  # `DOZZLE_FILTER` restricts the dashboard to OUR containers so unrelated
  # Docker stuff on the host machine doesn't clutter the list.
  #
  # Auth is intentionally disabled — dev only, bound to localhost. Do NOT
  # publish 9999 on a public interface.
  # ──────────────────────────────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: mova_dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Only show our containers — name prefix matches the `mova_*` pattern
      # used in container_name across docker-compose.yml.
      DOZZLE_FILTER: "name=mova_"
      DOZZLE_LEVEL: "info"
      DOZZLE_NO_ANALYTICS: "true"
    networks:
      - mova_network

  # ──────────────────────────────────────────────────────────────────────────
  # admin — Vite-powered React SPA for the admin panel (dev only).
  #
  # http://localhost:5174 — login with ADMIN_PASSWORD from .env.
  # The vite dev server bind-mounts apps/admin source so HMR works against
  # live edits; node_modules stays inside the container to avoid host/Linux
  # binary mismatch.
  # ──────────────────────────────────────────────────────────────────────────
  admin:
    image: node:20-alpine
    container_name: mova_admin
    working_dir: /app
    command: ["sh", "-c", "test -x node_modules/.bin/vite || npm install; npx vite --host 0.0.0.0 --port 5174"]
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    environment:
      # Point the SPA at the api-gateway container over the docker
      # network. The vite proxy in vite.config.ts is for the host
      # dev-run only; inside docker we hit the service by name.
      VITE_API_BASE: "http://localhost:3000/v1"
    depends_on:
      - api-gateway
    networks:
      - mova_network
