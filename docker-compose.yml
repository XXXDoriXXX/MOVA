version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: voice-agent-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: "--requirepass fish-potato-table"
    volumes:
      - redis_data:/data
    networks:
      - voice-network

networks:
  voice-network:
    driver: bridge

volumes:
  redis_data:
