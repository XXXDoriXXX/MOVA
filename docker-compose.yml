# ============================================================================
# Mova Backend — Production-shaped Compose Stack
# ============================================================================
#
# What runs:
#   postgres         Postgres 16 (schema lives here)
#   redis            Redis Stack (pub/sub + streams + cache)
#   migrations       One-shot — applies TypeORM migrations, then exits
#   api-gateway      REST API on :3000
#   realtime-service WS gateway on :3002
#   agent-worker     LiveKit agent (no exposed HTTP, only Redis I/O)
#
# Start order is enforced via depends_on + healthchecks:
#   postgres + redis → migrations → api-gateway / realtime-service / agent-worker
#
# Development overrides live in docker-compose.override.yml. Compose auto-merges
# both files. To run the production-shaped stack ignoring dev overrides:
#   docker compose -f docker-compose.yml up -d --build
# ============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Postgres — schema authority
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mova_dev
    ports:
      # Host-port 5433 → container 5432 to dodge clashes with a locally
      # installed Postgres on Windows hosts. Inside the Docker network
      # services still reach it as `postgres:5432`.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mova_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mova_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # Redis Stack — pub/sub + streams + caches
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    container_name: mova_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    environment:
      # Pulls from the `REDIS_PASSWORD` value in your .env (falls back
      # to the dev default if unset). Both `redis-server --requirepass`
      # and the healthcheck below read the same variable, so they stay
      # in sync no matter what you put in .env.
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-mova-dev-redis-pw}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-mova-dev-redis-pw}"
    volumes:
      - redis_data:/data
    networks:
      - mova_network
    healthcheck:
      # $$REDIS_PASSWORD escapes to $REDIS_PASSWORD inside the container
      # so the shell expands it at runtime — same source as REDIS_ARGS.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ──────────────────────────────────────────────────────────────────────────
  # One-shot: apply TypeORM migrations, then exit.
  # api-gateway / realtime-service / agent-worker all depend_on this finishing
  # so they never serve traffic / dispatch against a stale schema.
  # ──────────────────────────────────────────────────────────────────────────
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: mova_migrations
    # Build shared-database first, then run typeorm against compiled JS.
    # See docker-compose.override.yml::migrations for the why.
    command: ["sh", "-c", "npx nx build shared-database && npx typeorm migration:run -d dist/libs/shared-database/src/data-source.js"]
    env_file:
      - .env
    environment:
      # Inside the network postgres resolves by service name. Override the
      # .env DATABASE_URL so host-side npm scripts can also keep using
      # localhost without conflict.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mova_dev
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mova_network
    restart: "no"

  # ──────────────────────────────────────────────────────────────────────────
  # api-gateway — REST + persistence consumer + admin
  # ──────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: api-gateway
    container_name: mova_api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mova_dev
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_SERVICE_URL: http://agent-worker:3001
      REALTIME_PUBLIC_URL: http://realtime-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - mova_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # realtime-service — Socket.IO gateway for live calls
  # ──────────────────────────────────────────────────────────────────────────
  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: realtime-service
    container_name: mova_realtime_service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mova_dev
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - mova_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # agent-worker — LiveKit agent (no HTTP, only Redis pub/sub)
  # ──────────────────────────────────────────────────────────────────────────
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_NAME: agent-worker
    container_name: mova_agent_worker
    restart: unless-stopped
    # No published ports — talks to LiveKit cloud + Redis only.
    dns:
      # LiveKit's WebRTC handshake is sensitive to DNS — pin Google's DNS
      # to avoid container-default DNS quirks on some hosts.
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      RUN_MODE: start
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mova_dev
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - mova_network

  # ──────────────────────────────────────────────────────────────────────────
  # Observability stack — Prometheus + Grafana + Loki + promtail + Alertmanager
  #
  # All ports bound to 127.0.0.1 so they're only reachable from the host (nginx
  # exposes Grafana externally with auth in prod). The internal mova_network
  # carries scrape + log push traffic.
  #
  # Operator setup:
  #   - To enable Telegram alerts, create a TELEGRAM_BOT_TOKEN file under
  #     ./infra/alertmanager/secrets/telegram_bot_token (one line, no newline)
  #     and set TELEGRAM_CHAT_ID env. See infra/alertmanager/alertmanager.yml.
  #   - Grafana default login admin / admin (change on first boot or via
  #     GF_SECURITY_ADMIN_PASSWORD env).
  # ──────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: mova_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - mova_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: mova_alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - mova_network

  loki:
    image: grafana/loki:latest
    container_name: mova_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - mova_network

  promtail:
    image: grafana/promtail:latest
    container_name: mova_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - mova_network

  grafana:
    image: grafana/grafana:latest
    container_name: mova_grafana
    restart: unless-stopped
    environment:
      # SECURITY: set GRAFANA_ADMIN_PASSWORD in .env. The empty default
      # below makes Grafana generate a random password on first boot
      # and print it to its startup log — safer than baking "admin"
      # in as the literal default which used to live here. To find
      # the generated value when you skipped setting it:
      #   docker compose logs grafana | grep -i "admin password"
      # In prod (NODE_ENV=production), set the env explicitly to a
      # vault-managed value.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # When the password env is empty, Grafana refuses to boot UNLESS
      # GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false (the default),
      # in which case it falls back to "admin/admin" on first run.
      # We flip the disable flag OFF and rely on the empty password
      # to trigger Grafana's "set it on first login" UI.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Disable anonymous access by default — but make it a single env flip
      # for dev convenience.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Datasource UIDs are referenced in dashboard JSON files. Pin them
      # rather than let Grafana auto-generate UUIDs which would break
      # dashboard provisioning on first boot.
      GF_DATASOURCES_DEFAULT_DATASOURCE_UID: "prometheus"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - mova_network

networks:
  mova_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
