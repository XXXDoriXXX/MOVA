# Cloudflare overwrites this header; direct LAN access is for trusted hosts only.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live { proxy_pass http://api-gateway:3000; }
    location = /health/ready { proxy_pass http://api-gateway:3000; }
    location /v1/ {
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
    location /socket.io/ {
        proxy_pass http://realtime-service:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
    location ~ /\. { return 404; }
    location = /admin { return 302 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / {
        proxy_pass http://mobile-web:80;
        proxy_set_header Host $host;
    }
}
